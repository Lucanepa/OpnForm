name: Build KSCW OpnForm images

on:
  push:
    branches: [kscw-customizations]
    paths:
      - 'client/**'
      - 'api/**'
      - 'docker/Dockerfile.client'
      - 'docker/Dockerfile.api'
      - 'docker/php-fpm-entrypoint'
      - 'docker/nginx.conf'
      - '.github/workflows/kscw-build.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      rebase:
        description: 'Rebase kscw-customizations on the latest upstream release before building'
        required: false
        default: 'true'
        type: choice
        options: [true, false]

env:
  IMAGE_NAME: ghcr.io/lucanepa/opnform-client
  API_IMAGE_NAME: ghcr.io/lucanepa/opnform-api
  UPSTREAM_URL: https://github.com/OpnForm/OpnForm.git

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout kscw-customizations
        uses: actions/checkout@v4
        with:
          ref: kscw-customizations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase on upstream
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebase == 'true')
        env:
          UPSTREAM: ${{ env.UPSTREAM_URL }}
        run: |
          git config user.name "kscw-bot"
          git config user.email "bot@kscw.ch"
          git remote add upstream "$UPSTREAM"
          git fetch --tags upstream main
          # Track tagged releases, not main: the API image runs upstream's
          # migrations against the prod database.
          RELEASE=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          UPSTREAM_SHA=$(git rev-parse "$RELEASE^{commit}")
          BASE_SHA=$(git merge-base HEAD "$UPSTREAM_SHA")
          if [ "$BASE_SHA" = "$UPSTREAM_SHA" ]; then
            echo "Already up to date with upstream $RELEASE"
          else
            echo "Rebasing on upstream $RELEASE ($UPSTREAM_SHA)"
            if git rebase "$UPSTREAM_SHA"; then
              git push --force-with-lease origin kscw-customizations
              echo "Rebased + pushed"
            else
              echo "::error::Rebase conflict — manual intervention required"
              git rebase --abort
              exit 1
            fi
          fi

      - name: Get upstream version tag
        id: version
        run: |
          git fetch --quiet --tags "$UPSTREAM_URL" || true
          VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          VERSION=${VERSION:-unknown}
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.client
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:kscw-latest
            ${{ env.IMAGE_NAME }}:kscw-${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:kscw-${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Audit API dependencies
        run: |
          if ! docker run --rm -v "$PWD/api:/app" -w /app composer:2 \
              audit --locked --no-interaction --format=plain; then
            echo "::warning::composer audit reports advisories in api/composer.lock — run composer update"
          fi

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.api
          build-args: |
            APP_VERSION=kscw-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}
          push: true
          tags: |
            ${{ env.API_IMAGE_NAME }}:kscw-latest
            ${{ env.API_IMAGE_NAME }}:kscw-${{ steps.version.outputs.version }}
            ${{ env.API_IMAGE_NAME }}:kscw-${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          platforms: linux/amd64

      - name: Summary
        env:
          IMG: ${{ env.IMAGE_NAME }}
          API_IMG: ${{ env.API_IMAGE_NAME }}
          VER: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo "## Build complete"
            echo ""
            echo "Pushed:"
            echo "- \`$IMG:kscw-latest\`"
            echo "- \`$IMG:kscw-$VER\`"
            echo "- \`$IMG:kscw-$SHA\`"
            echo "- \`$API_IMG:kscw-latest\`"
            echo "- \`$API_IMG:kscw-$VER\`"
            echo "- \`$API_IMG:kscw-$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
