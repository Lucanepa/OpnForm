name: Build KSCW OpnForm client

on:
  push:
    branches: [kscw-customizations]
    paths:
      - 'client/**'
      - 'docker/Dockerfile.client'
      - 'docker/nginx.conf'
      - '.github/workflows/kscw-build.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      rebase:
        description: 'Rebase kscw-customizations on upstream main before building'
        required: false
        default: 'true'
        type: choice
        options: [true, false]

env:
  IMAGE_NAME: ghcr.io/lucanepa/opnform-client
  UPSTREAM_URL: https://github.com/OpnForm/OpnForm.git

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout kscw-customizations
        uses: actions/checkout@v4
        with:
          ref: kscw-customizations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebase on upstream
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebase == 'true')
        env:
          UPSTREAM: ${{ env.UPSTREAM_URL }}
        run: |
          git config user.name "kscw-bot"
          git config user.email "bot@kscw.ch"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          BASE_SHA=$(git merge-base HEAD upstream/main)
          if [ "$BASE_SHA" = "$UPSTREAM_SHA" ]; then
            echo "Already up to date with upstream"
          else
            echo "Rebasing on upstream/main ($UPSTREAM_SHA)"
            if git rebase upstream/main; then
              git push --force-with-lease origin kscw-customizations
              echo "Rebased + pushed"
            else
              echo "::error::Rebase conflict — manual intervention required"
              git rebase --abort
              exit 1
            fi
          fi

      - name: Get upstream version tag
        id: version
        run: |
          VERSION=$(jq -r '.version' client/package.json 2>/dev/null || echo "unknown")
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.client
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:kscw-latest
            ${{ env.IMAGE_NAME }}:kscw-${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:kscw-${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        env:
          IMG: ${{ env.IMAGE_NAME }}
          VER: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          {
            echo "## Build complete"
            echo ""
            echo "Pushed:"
            echo "- \`$IMG:kscw-latest\`"
            echo "- \`$IMG:kscw-$VER\`"
            echo "- \`$IMG:kscw-$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
